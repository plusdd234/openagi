<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视图工坊 · 多视图出图 / 深度遮罩 / 贴图回投</title>
<!-- 样式跟桌面 App 里的 #mvWin 共用同一份，改一次两边同步 -->
<link rel="stylesheet" href="css/multiview.css">
</head>
<body>

<!-- ⚠ 这个 id 是 multiview.js 的锚点：桌面 App 里同样叫 #mvWin（那边是 .os-win），
     所以两处 DOM 结构必须保持一致。tools/multiview.js 里有一条断言在比对两边的
     mv* id 集合——加一个控件两处都要加，否则测试会红。 -->
<div class="mv-standalone" id="mvWin">

  <header class="mv-top">
    <svg class="mv-top-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.4 8.6V5a1.6 1.6 0 0 1 1.6-1.6h3.6"/>
      <path d="M15.4 3.4H19a1.6 1.6 0 0 1 1.6 1.6v3.6"/>
      <path d="M20.6 15.4V19a1.6 1.6 0 0 1-1.6 1.6h-3.6"/>
      <path d="M8.6 20.6H5a1.6 1.6 0 0 1-1.6-1.6v-3.6"/>
      <rect x="8.2" y="8.2" width="7.6" height="7.6" rx="1.1"/>
      <path d="M8.2 8.2h3.8v3.8H8.2zM12 12h3.8v3.8H12z" fill="currentColor" stroke="none"/>
    </svg>
    <div class="mv-top-t">视图工坊</div>
    <div class="mv-top-s">各格严格等比例 · 深度 / 遮罩导出 · 贴图回投</div>
    <div class="mv-top-sp"></div>
    <div class="mv-top-hint">拖入 glb / obj · <kbd>空格</kbd> 重新渲染 · <kbd>1</kbd>–<kbd>4</kbd> 切模式</div>
  </header>

  <!-- 窗口 DOM 与桌面 App 共用 apps/multiview/body.js，由下面的脚本填进来 -->
</div>

<!-- three.js 与解析器都是本地 vendor，双击这个文件就能用，不需要起服务 -->
<!-- 窗口 DOM 与桌面 App 共用这一份，别再在这里抄一遍。
     insertAdjacentHTML 而不是包一层宿主 div：.mv-wrap 必须是 #mvWin 的直接子元素，
     布局（flex 撑高）挂在 .mv-standalone .mv-wrap 这条链上，多一层就会塌。 -->
<script src="apps/multiview/body.js"></script>
<script>
  document.getElementById("mvWin").insertAdjacentHTML("beforeend", window.MV_BODY);
</script>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/OBJLoader.js"></script>
<!-- FBX 三件套：Model3D.ready() 要求 GLTFLoader / OBJLoader / FBXLoader 齐全，
     少一个就整页「three.js 没加载上」，一个模型都渲不出来 -->
<script src="vendor/fflate.js"></script>
<script src="vendor/NURBSUtils.js"></script>
<script src="vendor/NURBSCurve.js"></script>
<script src="vendor/FBXLoader.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFExporter.js"></script>
<script src="js/model3d.js"></script>
<script src="js/tex-blend.js"></script>
<script src="js/texpaint.js"></script>
<script src="js/m3d-slots.js"></script>
<script src="js/m3d-preview.js"></script>
<script src="js/modeltex.js"></script>
<!-- 多视图 App：按依赖顺序加载（详见 js/multiview.js 顶部模块表） -->
<script src="js/mv-core.js"></script>
<script src="js/mv-layers.js"></script>
<script src="js/mv-state.js"></script>
<script src="js/mv-models.js"></script>
<script src="js/mv-render.js"></script>
<script src="js/mv-layer-panel.js"></script>
<script src="js/mv-panels.js"></script>
<script src="js/mv-bind.js"></script>
<script src="js/mv-project.js"></script>
<script src="js/multiview.js"></script>
<script src="js/llm-router.js"></script>
<script src="js/model-split.js"></script>
<script>
  (function () {
    function boot() {
      if (window.multiview && typeof multiview.open === 'function') multiview.open();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
</script>
</body>
</html>
