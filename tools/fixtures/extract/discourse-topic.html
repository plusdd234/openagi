        <script type="application/json" id="data-preloaded">{"topic_110122":"{\"post_stream\":{\"posts\":[{\"id\":306464,\"name\":\"Kent\",\"username\":\"thiskent\",\"avatar_template\":\"/user_avatar/discuss.python.org/thiskent/{size}/39130_2.png\",\"created_at\":\"2026-11-15T05:41:26.784Z\",\"cooked\":\"\\u003cp\\u003eHi everyone! I wanted to propose adding an in-place \\u003ccode\\u003elist.replace(old, new, /, count=-1)\\u003c/code\\u003e method to \\u003ccode\\u003elist\\u003c/code\\u003e and \\u003ccode\\u003eUserList\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eRight now, if we want to replace matching elements inside a list in place without allocating a temporary list via \\u003ccode\\u003elst[:] = [...]\\u003c/code\\u003e, we either write a manual \\u003ccode\\u003eenumerate\\u003c/code\\u003e loop or scan the list twice to avoid \\u003ccode\\u003eValueError\\u003c/code\\u003e from \\u003ccode\\u003elist.index()\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\"python\\\"\\u003e\\u003ccode class=\\\"lang-python\\\"\\u003e# Example\\n\\n## Loop then check\\nif old in key_list:\\n    key_list[key_list.index(old)] = new\\n\\n## My proposed list.replace():\\nkey_list.replace(old, new, count=1)\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThis proposed \\u003ccode\\u003e.replace()\\u003c/code\\u003e mutates the list in place, returns \\u003ccode\\u003eNone\\u003c/code\\u003e, and compares single top-level elements (\\u003ccode\\u003eself[i] is old or self[i] == old\\u003c/code\\u003e). And like \\u003ccode\\u003estr.replace()\\u003c/code\\u003e, it is a no-op when \\u003ccode\\u003eold\\u003c/code\\u003e is not found and uses \\u003ccode\\u003ecount=-1\\u003c/code\\u003e to support replacing either all matches or the first \\u003ccode\\u003ecount\\u003c/code\\u003e matches.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat do you all think?\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":6,\"updated_at\":\"2026-11-15T05:41:26.784Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":2,\"reads\":33,\"readers_count\":32,\"score\":16.6,\"yours\":false,\"topic_id\":110122,\"topic_slug\":\"add-list-replace-old-new-count-1-for-in-place-element-replacement\",\"display_username\":\"Kent\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":97388,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/add-list-replace-old-new-count-1-for-in-place-element-replacement/110122/1\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":306465,\"name\":\"Sacul\",\"username\":\"Sacul\",\"avatar_template\":\"/user_avatar/discuss.python.org/sacul/{size}/31942_2.png\",\"created_at\":\"2026-11-15T07:29:07.674Z\",\"cooked\":\"\\u003cp\\u003eI think using \\u003ccode\\u003eenumerate\\u003c/code\\u003e is just fine to me\\u003c/p\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":6,\"updated_at\":\"2026-11-15T07:29:07.674Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":20,\"readers_count\":19,\"score\":29.0,\"yours\":false,\"topic_id\":110122,\"topic_slug\":\"add-list-replace-old-new-count-1-for-in-place-element-replacement\",\"display_username\":\"Sacul\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":63542,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/add-list-replace-old-new-count-1-for-in-place-element-replacement/110122/2\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":306466,\"name\":\"Sergey B Kirpichev\",\"username\":\"skirpichev\",\"avatar_template\":\"/user_avatar/discuss.python.org/skirpichev/{size}/10996_2.png\",\"created_at\":\"2026-11-15T07:35:16.519Z\",\"cooked\":\"\\u003cp\\u003eWhat’s wrong with using enumerate, for example?\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\"py\\\"\\u003e\\u003ccode class=\\\"lang-py\\\"\\u003edef list_replace(xs, old, new, count=-1):\\n    if count \\u0026lt; 0:\\n        count = len(xs)\\n    cnt = 0\\n    for idx, elt in enumerate(xs):\\n        if elt == old:\\n            if cnt \\u0026lt; count:\\n                xs[idx] = new\\n                cnt += 1\\n            else:\\n                break\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eOr you can scan list to get indices of matched elements and then go over this set of indices to do replace.  No need to scan list twice or catch exceptions…\\u003c/p\\u003e\\n\\u003cp\\u003ePeople also could use other data types than list, e.g. ndarray’s:\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\"pycon\\\"\\u003e\\u003ccode class=\\\"lang-pycon\\\"\\u003e\\u0026gt;\\u0026gt;\\u0026gt; import numpy as np\\n\\u0026gt;\\u0026gt;\\u0026gt; a = np.array([1, 2, 3, 2, 10, 11, 2, 15])\\n\\u0026gt;\\u0026gt;\\u0026gt; a[np.where(a == 2)[0]] = 123  # replace all\\n\\u0026gt;\\u0026gt;\\u0026gt; a\\narray([  1, 123,   3, 123,  10,  11, 123,  15])\\n\\u0026gt;\\u0026gt;\\u0026gt; a[np.where(a == 123)[0][:2]] = 2  # at most two\\n\\u0026gt;\\u0026gt;\\u0026gt; a\\narray([  1,   2,   3,   2,  10,  11, 123,  15])\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003ewhen one-liners with temporary list are too expensive.\\u003c/p\\u003e\\n\\u003cp\\u003eNote, that your proposal is \\u003cem\\u003enot\\u003c/em\\u003e like \\u003ccode\\u003estr.replace()\\u003c/code\\u003e, which replaces \\u003cem\\u003esubstrings\\u003c/em\\u003e rather than characters.  Remember, that \\u003ccode\\u003elist('abc')\\u003c/code\\u003e is \\u003ccode\\u003e['a', 'b', 'c']\\u003c/code\\u003e.  To match this behavior, probably your method should rather replace sublists, e.g. \\u003ccode\\u003e[1, 2, 3].replace([1, 2], [4]) -\\u0026gt; [4, 3]\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003ePlease take look on \\u003ca href=\\\"https://devguide.python.org/developer-workflow/lang-changes/#suggesting-new-features-and-language-changes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eSuggesting new features and language changes\\u003c/a\\u003e.  It’s not clear, especially, what benefits this brings to Python users.  Is this something occurring in applications, can you show examples in real-world code?\\u003c/p\\u003e\",\"post_number\":3,\"post_type\":1,\"posts_count\":6,\"updated_at\":\"2026-11-15T07:35:16.519Z\",\"reply_count\":2,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":19,\"readers_count\":18,\"score\":33.8,\"yours\":false,\"topic_id\":110122,\"topic_slug\":\"add-list-replace-old-new-count-1-for-in-place-element-replacement\",\"display_username\":\"Sergey B Kirpichev\",\"primary_group_name\             <div class='post' itemprop="text">
              <p>Hi everyone! I wanted to propose adding an in-place <code>list.replace(old, new, /, count=-1)</code> method to <code>list</code> and <code>UserList</code>.</p>
<p>Right now, if we want to replace matching elements inside a list in place without allocating a temporary list via <code>lst[:] = [...]</code>, we either write a manual <code>enumerate</code> loop or scan the list twice to avoid <code>ValueError</code> from <code>list.index()</code>.</p>
<pre data-code-wrap="python"><code class="lang-python"># Example

## Loop then check
if old in key_list:
    key_list[key_list.index(old)] = new

## My proposed list.replace():
key_list.replace(old, new, count=1)
</code></pre>
<p>This proposed <code>.replace()</code> mutates the list in place, returns <code>None</code>, and compares single top-level elements (<code>self[i] is old or self[i] == old</code>). And like <code>str.replace()</code>, it is a no-op when <code>old</code> is not found and uses <code>count=-1</code> to support replacing either all matches or the first <code>count</code> matches.</p>
<p>What do you all think?</p>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2026-11-15T07:35:16Z' class='post-time'>

              </span>
            </div>
            <div class='post' itemprop="text">
              <p>What’s wrong with using enumerate, for example?</p>
<pre data-code-wrap="py"><code class="lang-py">def list_replace(xs, old, new, count=-1):
    if count &lt; 0:
        count = len(xs)
    cnt = 0
    for idx, elt in enumerate(xs):
        if elt == old:
            if cnt &lt; count:
                xs[idx] = new
                cnt += 1
            else:
                break
</code></pre>
<p>Or you can scan list to get indices of matched elements and then go over this set of indices to do replace.  No need to scan list twice or catch exceptions…</p>
<p>People also could use other data types than list, e.g. ndarray’s:</p>
<pre data-code-wrap="pycon"><code class="lang-pycon">&gt;&gt;&gt; import numpy as np
&gt;&gt;&gt; a = np.array([1, 2, 3, 2, 10, 11, 2, 15])
&gt;&gt;&gt; a[np.where(a == 2)[0]] = 123  # replace all
&gt;&gt;&gt; a
array([  1, 123,   3, 123,  10,  11, 123,  15])
&gt;&gt;&gt; a[np.where(a == 123)[0][:2]] = 2  # at most two
&gt;&gt;&gt; a
array([  1,   2,   3,   2,  10,  11, 123,  15])
</code></pre>
<p>when one-liners with temporary list are too expensive.</p>
<p>Note, that your proposal is <em>not</em> like <code>str.replace()</code>, which replaces <em>substrings</em> rather than characters.  Remember, that <code>list('abc')</code> is <code>['a', 'b', 'c']</code>.  To match this behavior, probably your method should rather replace sublists, e.g. <code>[1, 2, 3].replace([1, 2], [4]) -&gt; [4, 3]</code>.</p>
<p>Please take look on <a href="https://devguide.python.org/developer-workflow/lang-changes/#suggesting-new-features-and-language-changes" rel="noopener nofollow ugc">Suggesting new features and language changes</a>.  It’s not clear, especially, what benefits this brings to Python users.  Is this something occurring in applications, can you show examples in real-world code?</p>
